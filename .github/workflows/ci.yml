name: 'ci'
on:
  workflow_call:

jobs:
  test-ubuntu:
    name: test on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dotfiles
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin init --apply --source .
      - name: Verify dotfiles
        run: chezmoi verify --source .
      - name: Check key files exist
        run: |
          test -f ~/.zshrc
          test -f ~/.bashrc
          test -f ~/.gitconfig
          test -f ~/.tmux.conf
          test -f ~/.profile
      - name: Syntax check shell files
        run: |
          bash -n ~/.bashrc
          bash -n ~/.profile
          command -v zsh >/dev/null 2>&1 && zsh -n ~/.zshrc || echo "zsh not installed, skipping zsh syntax check"
  test-macos:
    name: test on macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dotfiles
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin init --apply --source .
      - name: Verify dotfiles
        run: chezmoi verify --source .
      - name: Check key files exist
        run: |
          test -f ~/.zshrc
          test -f ~/.bashrc
          test -f ~/.gitconfig
          test -f ~/.tmux.conf
          test -f ~/.profile
      - name: Syntax check shell files
        run: |
          bash -n ~/.bashrc
          bash -n ~/.profile
          command -v zsh >/dev/null 2>&1 && zsh -n ~/.zshrc || echo "zsh not installed, skipping zsh syntax check"
